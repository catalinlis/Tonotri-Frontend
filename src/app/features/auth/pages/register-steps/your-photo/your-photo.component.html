<div class="background">
    <div class="w-full mt-22 lg:mt-17 md:w-4/5 xl:w-3/5 mx-auto">
        <div class="step-progress hidden md:flex items-center" aria-label="Registration progress">
            <div class="journey-step is-complete flex items-center">
                <span class="step-badge" aria-hidden="true">✓</span>
                <span class="step-copy"><small>Completed</small><strong>Personal Info</strong></span>
            </div>
            <span class="journey-line is-complete" aria-hidden="true"></span>
            <div class="journey-step is-current flex items-center" aria-current="step">
                <span class="step-badge">2</span>
                <span class="step-copy"><small>Current step</small><strong>Your photo</strong></span>
            </div>
            <span class="journey-line" aria-hidden="true"></span>
            <div class="journey-step is-upcoming flex items-center">
                <span class="step-badge">3</span>
                <span class="step-copy"><small>Up next</small><strong>Visited countries</strong></span>
            </div>
        </div>
        <div class="mobile-step md:hidden mb-2" aria-label="Registration progress">
            <div class="mobile-current-step flex items-center" aria-current="step">
                <span class="mobile-step-badge">2</span>
                <span class="grid leading-tight">
                    <small class="text-[10px] font-bold uppercase tracking-[0.12em] text-[#00a63a]">Step 2 of 3</small>
                    <strong class="mt-1 text-sm text-[#007d2c]">Your photo</strong>
                </span>
                <span class="ml-auto rounded-full bg-green-100 px-3 py-1 text-[11px] font-semibold text-green-700">Current</span>
            </div>
        </div>
        <div class="photo-hero block md:flex w-full p-4 bg-[#BC46E0] rounded-md items-center justify-center">
            <div class="hero-copy block group w-full md:w-1/2 p-3 pb-7 md:p-5">
                <small class="mb-2 block text-xs font-semibold uppercase tracking-[0.22em] text-white/75">Step 2 · Show your personality</small>
                <span class="transition-transform duration-300 group-hover:scale-105 inline-block leading-12 text-[26pt] text-white">Select your photo that represents you the best</span>
            </div>
            <div class="block w-full md:w-1/2 ml-auto">
                <img src="assets/register1.jpg" class="hero-image rounded-md border-3 border-white" alt="Travelers sharing a memorable experience">
            </div>
        </div>
        <div class="photo-workspace block md:flex w-full mx-auto mt-2">
            <div class="preview-panel flex w-full md:w-2/3 bg-[#BFADE0] rounded-sm p-6 items-center justify-center">
                <div class="avatar-shell relative flex items-center justify-center w-[200px] h-[200px] bg-white rounded-full
                            transition-transform duration-300 ease-in-out hover:scale-110 cursor-pointer">
                    <div class="flex items-center justify-center w-[192px] h-[192px] border-3 border-[#B59FE1] rounded-full">
                        <img *ngIf="previewUrl" [src]="previewUrl" class="photo selected-photo" alt="Selected profile photo preview">
                        <div *ngIf="!previewUrl" class="avatar-options w-[140px] h-[140px]">
                            <div class="grid grid-cols-2 gap-2">
                                <img src="assets/man1.png" alt="Avatar example">
                                <img src="assets/woman1.png" alt="Avatar example">
                                <img src="assets/man2.png" alt="Avatar example">
                                <img src="assets/woman2.png" alt="Avatar example">
                            </div>
                        </div>
                    </div>
                    <span *ngIf="previewUrl" class="photo-ready absolute bottom-1 right-1 flex h-9 w-9 items-center justify-center rounded-full border-2 border-white bg-[#00B640] text-lg font-bold text-white shadow-lg" aria-label="Photo ready">✓</span>
                </div>
            </div>
            <div class="upload-panel block md:flex md:flex-col mt-2 md:mt-0 md:ml-2 w-full md:w-1/3 items-center rounded-sm">
                <div class="upload-info h-auto bg-[#D77CE0] p-1 rounded-sm">
                    <div class="flex w-full bg-[#D77CE0] justify-center items-center border-1 border-white rounded-sm p-1">
                        <div class="flex justify-center w-1/10">
                            <img src="assets/information-white.png" width="20" alt="">
                        </div>
                        <div class="w-9/10 ml-1">
                            <div class="text-sm text-white">
                                Upload a profile photo to personalize your account.<br>
                                JPG or PNG, max 5MB.
                            </div>
                        </div>
                    </div>
                </div>
                <input #file type="file" accept="image/jpeg,image/png" (change)="onFileSelected($event)" class="hidden">
                <button (click)="file.click()" class="upload-button flex md:flex-col justify-center items-center transition-transform duration-500 hover:scale-105 w-full md:w-full md:h-full 
                               p-5 md:p-0 bg-[#B75AE0] text-white text-[25px] rounded-sm mt-2 cursor-pointer border-1 border-[#7300B6]">
                    <div>{{ previewUrl ? 'Change photo' : 'Upload photo' }}</div><br/>
                    <div class="camera-icon flex justify-center items-center bg-white w-[55px] h-[55px] ml-7 md:ml-0 md:w-[70px] md:h-[70px] rounded-full border-2 border-[#7300B6]"><img src="assets/camera.png" width="40" alt=""></div>
                </button>
            </div>
        </div>
        <div class="next-actions flex w-full mx-auto mt-2 pl-1">
            <button class="next-button w-full flex justify-center items-center md:w-1/3 transition-transform duration-500 hover:scale-102 p-3 pl-10 pr-10 text-[22px] text-white bg-[#3248D9] rounded-sm ml-auto mb-[100px] cursor-pointer"
            (click)="nextStep()">
                <span *ngIf="!previewUrl" class="flex">Skip this step</span>
                <span *ngIf="previewUrl" class="flex">Next step</span>
                <img src="assets/next.png" class="flex ml-3 w-[23px]" alt="">
            </button>
        </div>
    </div>
</div>
