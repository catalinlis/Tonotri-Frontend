<div class="location-filter" (keydown.escape)="open.set(false); trigger.focus(); $event.stopPropagation()">
  <button type="button" #trigger class="filter-chip location-trigger"
    [class.active]="active() || open()" [attr.aria-expanded]="open()"
    [attr.aria-label]="label() + ', ' + selectedLabel()" (click)="toggle(trigger)">
    {{ value() ? selectedLabel() : label() }}
    <span class="menu-chevron" aria-hidden="true"></span>
  </button>
  @if (open()) {
    <div class="location-menu" [class.location-menu--above]="opensUp()"
      [class.sort-menu]="alignRight()" role="group" [attr.aria-label]="label()">
      @for (option of options(); track option.value) {
        <button type="button" [class.selected]="value() === option.value"
          [attr.aria-pressed]="value() === option.value" (click)="select(option.value, trigger)">
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
