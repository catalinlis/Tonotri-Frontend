<main class="country-overview">
  <header class="header">
    <img
      [src]="countryImage()"
      [alt]="countryName() + ' landscape'"
      fetchpriority="high"
      decoding="async"
    />
    <span class="header-shade" aria-hidden="true"></span>
    <a class="back-link" routerLink="/countries" aria-label="Back to all countries">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
      All countries
    </a>
    <h1 class="header-country-name">{{ countryName() }}</h1>
  </header>

  <app-section-navigation
    [items]="countrySections()"
    [ariaLabel]="countryName() + ' sections'"
  />

  <div class="profile-zone-content">
    @switch (activeSection()) {
      @case ('posts') {
        <app-country-posts [countryName]="countryName()" [posts]="countryPosts()" />
      }
      @case ('photos') {
        <app-country-photos [countryName]="countryName()" [photos]="countryPhotos()" />
      }
      @case ('reviews') {
        <app-country-reviews [countryName]="countryName()" [countrySlug]="countrySlug()" [reviews]="countryReviews()" />
      }
      @default {
        <app-country-overview [countryName]="countryName()" [countrySlug]="countrySlug()"
          [description]="description()"
          [posts]="countryPosts()"
          [reviews]="countryReviews()" />
      }
    }
  </div>
</main>
