<main class="countries-page">
  <header class="header">
    <img
      src="assets/earth.jpg"
      fetchpriority="high"
      decoding="async"
    />
  </header>

  <div class="country-picker-heading">
    <div class="choose-country-title">Choose a country</div>

    <label class="country-search">
      <span class="sr-only">Search countries</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
      <input
        type="search"
        placeholder="Search countries"
        [value]="searchTerm()"
        (input)="onSearch($event)"
      />
    </label>
  </div>

  @if (visibleFeaturedCountries().length) {
    <nav class="featured-countries" aria-label="Featured countries">
      @for (country of visibleFeaturedCountries(); track country.slug) {
        <a class="country-card" [routerLink]="[country.slug]">
          <img
            [src]="country.image"
            [alt]="country.name"
            width="800"
            height="520"
            loading="lazy"
            decoding="async"
          />
          <span class="country-card-shade" aria-hidden="true"></span>
          <strong>{{ country.name }}</strong>
        </a>
      }
    </nav>
  } @else {
    <div class="country-search-empty" aria-live="polite">No countries match your search.</div>
  }

</main>
