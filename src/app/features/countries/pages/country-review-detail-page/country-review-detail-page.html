<article class="review-detail" aria-labelledby="review-detail-title">
  <a class="back-link" [routerLink]="['/countries', countrySlug()]">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
    Back to {{ countryName() }}
  </a>

  <div class="review-heading">
    <p>Traveler review</p>
    <h2 id="review-detail-title">Review {{ reviewId() }}</h2>
    <span>Country: {{ countryName() }}</span>
  </div>

  <div class="review-placeholder">
    <span aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5" /></svg>
    </span>
    <div>
      <strong>Review detail route is ready</strong>
      <p>Load review <code>{{ reviewId() }}</code> from the API and render its author, rating, story, and photos here.</p>
    </div>
  </div>
</article>
