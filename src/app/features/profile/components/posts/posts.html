<header class="posts-header">
  <div class="left-header">Travel Stories</div>
  <span class="posts-count">{{ postsCount }} posts</span>
</header>

@if (currentUser(); as user) {
  <app-post-card [post]="post"
    [author]="user.first_name + ' ' + user.last_name" [authorImage]="profilePhotoUrl()"
    (openPhoto)="openPostGallery($event)" />

  <app-post-card [post]="journey" [journey]="journey"
    [author]="user.first_name + ' ' + user.last_name" [authorImage]="profilePhotoUrl()"
    (openPhoto)="openJourneyGallery($event)" />
}
