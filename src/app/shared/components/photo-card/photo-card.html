@let photo = this.photo();
<article class="photo-card" [class.photo-card--featured]="featured()">
        <button type="button" class="photo-open-button" (click)="openPhoto.emit()" aria-label="Open {{ photo.title }} photo">
          @if (!loadedImages().has(photo.url)) {
            <app-loader class="photo-image-loader" Cwidth="100%" Cheight="100%" [radius]="0" />
          }
          <img [src]="photo.url" [alt]="photo.alt" loading="lazy" decoding="async"
            [class.image-pending]="!loadedImages().has(photo.url)"
            (load)="markImageLoaded(photo.url)" (error)="markImageLoaded(photo.url)">
          <span class="photo-overlay">
            <strong>{{ photo.title }}</strong>
            <span>{{ photo.country }} &middot; {{ photo.date }}</span>
          </span>
        </button>
        <button type="button" class="favorite-photo" (click)="favoritePhoto.emit()" aria-label="Add {{ photo.title }} to favorites">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.7-7.5 1.1-1.1a5.5 5.5 0 0 0 0-7.8Z"></path>
          </svg>
        </button>
      </article>
